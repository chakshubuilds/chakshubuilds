<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chakshu Arora (@chakshubuilds) — Live Terminal Profile Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    .preview-container {
      width: 100%;
      max-width: 1180px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: #0A101F;
      border: 1px solid #1c284a;
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
    }
    .status-pill {
      color: #10B981;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-pill::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
    }
    .section-label {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      color: #22D3EE;
      margin-bottom: 12px;
    }
    .card {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .card img, .card object {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <div class="status-header">
      <div><strong>GITHUB PROFILE PIPELINE</strong> // @chakshubuilds</div>
      <div class="status-pill">PHASE 1 COMPLETE · 1180×610 TERMINAL BANNER</div>
    </div>

    <div>
      <div class="section-label">01 // DARK MODE BANNER (dark.svg)</div>
      <div class="card">
        <object data="dark.svg" type="image/svg+xml"></object>
      </div>
    </div>

    <div>
      <div class="section-label">02 // LIGHT MODE BANNER (light.svg)</div>
      <div class="card" style="background: #f1f5f9; padding: 20px;">
        <object data="light.svg" type="image/svg+xml"></object>
      </div>
    </div>
  </div>
</body>
</html>
